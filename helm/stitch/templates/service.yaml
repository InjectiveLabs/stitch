{{- $listeners := include "stitch.effectiveListeners" . | fromYaml -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stitch.serviceName" . }}
  labels:
    {{- include "stitch.labels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  sessionAffinity: {{ .Values.service.sessionAffinity }}
  selector:
    {{- include "stitch.selectorLabels" . | nindent 4 }}
  ports:
    {{- range $name, $listener := $listeners }}
    {{- if $listener.enabled }}
    - name: {{ $name }}
      port: {{ $listener.port }}
      targetPort: {{ $name }}
      protocol: TCP
      appProtocol: {{ $listener.appProtocol }}
    {{- end }}
    {{- end }}
