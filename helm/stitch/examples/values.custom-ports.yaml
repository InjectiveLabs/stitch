# Structured Stitch configuration using non-default listener ports. The chart
# derives the container and ClusterIP Service ports from these addresses.
listen:
  rpc:     { addr: "0.0.0.0:30000" }
  api:     { addr: "0.0.0.0:30001" }
  grpc:    { addr: "0.0.0.0:30002" }
  admin:   { addr: "0.0.0.0:30099" }

log:
  level: info
  format: json

policies:
  failover:
    max_attempts: 3
    per_attempt_timeout: 8s
  hedging:
    enabled: true
    methods: [eth_call, eth_estimateGas, abci_query]
    hedge_after: 200ms
  circuit:
    error_threshold: 0.8
    min_requests: 50
    open_duration: 30s
  cache:
    enabled: true
    confirmation_depth: 100
    ttl: 5m
    hash_index_entries: 100000
    response_entries: 50000
    l1_size_mb: 2048
  health:
    probe_interval: 5s
    max_lag_blocks: 100
  subscriptions:
    multicast: true
    slow_consumer: drop
    replay_timeout: 30s
  dangerous_methods:
    allow: ["*"]

backends:
  - name: archive
    coverage: { kind: archive }
    weight: 100
    tags: [archive]
    endpoints:
      rpc: http://archive.example.internal:26657
      api: http://archive.example.internal:10337
      grpc: archive.example.internal:9900
