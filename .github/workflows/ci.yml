name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Test the version declared in go.mod and the
        # latest stable so new-toolchain regressions surface early.
        go: ["module", "stable"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        if: matrix.go == 'module'
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-go@v5
        if: matrix.go == 'stable'
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build -mod=readonly -o /tmp/stitch ./cmd/stitch

      - name: test
        run: go test -mod=readonly -timeout=5m ./...

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: test -race
        run: go test -race -count=1 -timeout=10m ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: v2.12.2
          args: --timeout=5m
          only-new-issues: true

  example-configs:
    name: example configs validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build stitch
        run: go build -mod=readonly -o /tmp/stitch ./cmd/stitch
      - name: validate each example loads
        run: |
          set -e
          export ARCHIVE_RPC_URL=http://x:26657
          export ARCHIVE_GRPC_URL=x:9900
          export ARCHIVE_API_URL=http://x:1317
          export ARCHIVE_ETH_RPC_URL=http://x:8545
          export ARCHIVE_ETH_WS_URL=ws://x:8546
          export ARCHIVE_CHAINSTREAM_URL=x:9999
          export HOT_RPC_URL=http://x:26657
          export HOT_GRPC_URL=x:9900
          export HOT_API_URL=http://x:1317
          export HOT_ETH_RPC_URL=http://x:8545
          export HOT_ETH_WS_URL=ws://x:8546
          for f in examples/*.yaml; do
            [ "$f" = "examples/docker-compose.yaml" ] && continue
            echo "loading $f"
            timeout 3s /tmp/stitch start --config "$f" --shutdown-grace 1s || rc=$?
            # graceful shutdown after timeout = 0 or 124; anything else is a real failure
            [ "$rc" = "124" ] || [ "$rc" = "0" ] || [ -z "$rc" ] || { echo "FAIL: $f exited $rc"; exit 1; }
          done

  helm-chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.13.1
      - name: lint
        run: >-
          helm lint ./helm/stitch
          --values ./helm/stitch/examples/values.internal.yaml
      - name: render internal-only resources
        run: |
          helm template stitch ./helm/stitch \
            --namespace injective \
            --values ./helm/stitch/examples/values.internal.yaml \
            > /tmp/stitch-internal.yaml
          ! grep -Eq '^kind: (Ingress|Gateway|HTTPRoute|GRPCRoute)$' /tmp/stitch-internal.yaml
          grep -q '^  type: ClusterIP$' /tmp/stitch-internal.yaml
          grep -q '^  replicas: 2$' /tmp/stitch-internal.yaml
      - name: render structured configuration with custom ports
        run: |
          helm lint ./helm/stitch \
            --values ./helm/stitch/examples/values.custom-ports.yaml
          helm template stitch ./helm/stitch \
            --namespace injective \
            --values ./helm/stitch/examples/values.custom-ports.yaml \
            > /tmp/stitch-custom-ports.yaml
          grep -q '^      port: 30000$' /tmp/stitch-custom-ports.yaml
          grep -q '^              containerPort: 30000$' /tmp/stitch-custom-ports.yaml
          grep -q '^      port: 30099$' /tmp/stitch-custom-ports.yaml
          ! grep -q '^      name: eth-rpc$' /tmp/stitch-custom-ports.yaml
          ! grep -q '^      name: eth-ws$' /tmp/stitch-custom-ports.yaml
      - name: render Gateway API resources
        run: |
          helm template stitch ./helm/stitch \
            --namespace injective \
            --api-versions gateway.networking.k8s.io/v1/HTTPRoute \
            --values ./helm/stitch/examples/values.internal.yaml \
            --values ./helm/stitch/examples/values.gateway.yaml \
            > /tmp/stitch-gateway.yaml
          test "$(grep -c '^kind: HTTPRoute$' /tmp/stitch-gateway.yaml)" -eq 2
          ! grep -q '^kind: GRPCRoute$' /tmp/stitch-gateway.yaml
          grep -q '^  name: stitch-grpc$' /tmp/stitch-gateway.yaml
          grep -q '^  name: stitch-chainstream$' /tmp/stitch-gateway.yaml
          ! grep -q '^kind: Ingress$' /tmp/stitch-gateway.yaml
      - name: verify naming override
        run: |
          helm template stitch ./helm/stitch \
            --namespace injective \
            --values ./helm/stitch/examples/values.internal.yaml \
            --set fullnameOverride=stitch-testnet \
            > /tmp/stitch-override.yaml
          grep -q '^  name: stitch-testnet-service$' /tmp/stitch-override.yaml
          grep -q '^  name: stitch-testnet-config$' /tmp/stitch-override.yaml
