run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
    - forbidigo

linters-settings:
  forbidigo:
    forbid:
      - p: "^fmt\\.Print.*$"
        msg: "use internal/log (slog) instead of fmt.Print*"
      - p: "^log\\.Print.*$"
        msg: "use internal/log (slog) instead of stdlib log"

issues:
  exclude-rules:
    - path: cmd/stitch/main\.go
      linters:
        - forbidigo
    - path: internal/cmd/.*\.go
      linters:
        - forbidigo
