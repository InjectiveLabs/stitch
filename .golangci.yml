version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - forbidigo
    - gosec
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
  settings:
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: use internal/log (slog) instead of fmt.Print*
        - pattern: ^log\.Print.*$
          msg: use internal/log (slog) instead of stdlib log
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - forbidigo
        path: cmd/stitch/main\.go
      - linters:
          - forbidigo
        path: internal/cmd/.*\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
